<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Luminous Nix</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>❄️</text></svg>">
    <style>
        :root {
            --nix-blue: #5277C3;
            --nix-light: #7EBAE4;
            --sacred-gold: #FFD700;
            --soft-black: #1a1a2e;
            --pure-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #2d3561);
            color: var(--pure-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            background: linear-gradient(135deg, var(--nix-light), var(--sacred-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2rem;
            color: var(--nix-light);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        a {
            display: inline-block;
            background: linear-gradient(135deg, var(--nix-blue), var(--nix-light));
            color: white;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s;
        }

        a:hover {
            transform: translateY(-3px);
        }

        a:focus {
            outline: 3px solid var(--sacred-gold);
            outline-offset: 2px;
        }

        .snowflake {
            font-size: 4rem;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="snowflake">❄️</div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Looks like this path doesn't exist in our Nix configuration. Let's get you back on track!</p>
        <a href="/">Return Home</a>
    </div>
</body>
</html>
