# GitHub Issue Labels Configuration
# Can be synced with: https://github.com/Financial-Times/github-label-sync

# Type Labels
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working correctly"

- name: "feature"
  color: "a2eeef"
  description: "New feature or enhancement request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "accessibility"
  color: "5319e7"
  description: "Accessibility improvements or issues (a11y)"

# Priority Labels
- name: "priority: critical"
  color: "b60205"
  description: "Critical priority - needs immediate attention"

- name: "priority: high"
  color: "d93f0b"
  description: "High priority - should be addressed soon"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority - normal timeline"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority - nice to have"

# Status Labels
- name: "status: needs triage"
  color: "ededed"
  description: "Needs initial assessment"

- name: "status: in progress"
  color: "c2e0c6"
  description: "Currently being worked on"

- name: "status: blocked"
  color: "e99695"
  description: "Blocked by another issue or external factor"

- name: "status: on hold"
  color: "fef2c0"
  description: "On hold for now"

- name: "status: needs review"
  color: "fbca04"
  description: "Ready for review"

# Area Labels
- name: "area: design"
  color: "e4e669"
  description: "UI/UX design related"

- name: "area: seo"
  color: "5319e7"
  description: "SEO and discoverability"

- name: "area: performance"
  color: "1d76db"
  description: "Performance and optimization"

- name: "area: security"
  color: "b60205"
  description: "Security related"

- name: "area: mobile"
  color: "bfdadc"
  description: "Mobile specific issues"

- name: "area: content"
  color: "c5def5"
  description: "Content and copy changes"

# Community Labels
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers - easy to start with"

- name: "help wanted"
  color: "008672"
  description: "Extra attention needed - community help welcome"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "discussion"
  color: "cc317c"
  description: "Discussion or brainstorming needed"

# Resolution Labels
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right or valid"

# Special Labels
- name: "breaking change"
  color: "d73a4a"
  description: "Introduces breaking changes"

- name: "dependencies"
  color: "0366d6"
  description: "Dependencies updates"

- name: "automation"
  color: "c2e0c6"
  description: "CI/CD and automation related"
