# Dependabot configuration for keeping dependencies up to date
# Learn more: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automation"
    commit-message:
      prefix: "⬆️"
      include: "scope"

  # Monitor npm (if we add any npm dependencies in future)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "⬆️"
      include: "scope"
    ignore:
      # Ignore patch updates (only minor and major)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
